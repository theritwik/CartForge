name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cartforge
          POSTGRES_PASSWORD: cartforge_ci
          POSTGRES_DB: cartforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartforge -d cartforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Credentials for the throwaway service containers above.
      DATABASE_URL: postgresql://cartforge:cartforge_ci@localhost:5432/cartforge
      TEST_DATABASE_URL: postgresql://cartforge:cartforge_ci@localhost:5432/cartforge_test
      REDIS_URL: redis://localhost:6379
      # Tests only need the cache kept apart from rate limits, so a second database index is
      # enough here. Locally and in deployment the cache is a separate instance with eviction.
      CACHE_REDIS_URL: redis://localhost:6379/1
      API_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @cartforge/db exec prisma validate
      - run: pnpm --filter @cartforge/db migrate:deploy
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
