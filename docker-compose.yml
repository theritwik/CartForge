name: cartforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Rate-limit counters. No memory limit and the default noeviction policy, so a counter
    # is never removed before its window ends.
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache:
    image: redis:8-alpine
    # Catalog cache only. Bounded memory: when full, keys with a TTL are evicted soonest-expiring
    # first, which spares the catalog generation counter. Not persisted; it starts empty.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      - '127.0.0.1:${CACHE_REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # The full stack from production images: docker compose --profile full up --build
  # The browser talks only to the web app on port 8080; the API is not published.
  migrate:
    profiles: [full]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [full]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    environment:
      NODE_ENV: production
      API_PORT: 4000
      LOG_LEVEL: info
      # http://localhost is accepted in production because browsers treat it as secure.
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
      TRUST_PROXY_HOPS: 0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      CACHE_REDIS_URL: redis://redis-cache:6379
      # Required: in production the API refuses to start without Stripe test-mode keys, as
      # there is no simulator. Set them in .env (see docs/stripe-test-mode.md).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      redis-cache: { condition: service_healthy }

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: 'http://api:4000' }
    environment:
      API_URL: http://api:4000
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:3000'
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
